[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-learning-pipeline"
version = "0.1.0"
description = "AI learning pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "python-dotenv>=1.2.2",
    "typer>=0.27.1",
]

[project.scripts]
learn = "learning_pipeline.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learning_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
