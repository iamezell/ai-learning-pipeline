[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-learning-pipeline"
version = "0.1.0"
description = "AI learning pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/learning_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
